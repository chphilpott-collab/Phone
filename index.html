<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Moneys">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C100F" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-180.png">
<title>Moneys</title>
<style>
:root {
  color-scheme: light;
  --bg: #F1F3F1;
  --surface: #FFFFFF;
  --surface-2: #E7EBE8;
  --ink: #13181A;
  --ink-2: #5B6469;
  --ink-3: #8D959A;
  --line: #E0E4E1;
  --pine: #1D6A55;
  --pine-ink: #FFFFFF;
  --pine-soft: #DCECE5;
  --sky: #3B78AE;
  --down: #B23838;
  --amber: #9C6410;
  --track: #DBE1DD;
  --veil: rgba(241, 243, 241, 0.82);
  --shadow: 0 1px 2px rgba(19, 24, 26, 0.05);
  --num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0C100F;
    --surface: #161B1A;
    --surface-2: #222927;
    --ink: #ECF0EE;
    --ink-2: #A3ACA8;
    --ink-3: #6E7874;
    --line: #262D2B;
    --pine: #57BD98;
    --pine-ink: #06120D;
    --pine-soft: #183029;
    --sky: #6FA8D8;
    --down: #EF7C74;
    --amber: #E2A64C;
    --track: #29322F;
    --veil: rgba(12, 16, 15, 0.84);
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0C100F; --surface: #161B1A; --surface-2: #222927; --ink: #ECF0EE; --ink-2: #A3ACA8; --ink-3: #6E7874;
  --line: #262D2B; --pine: #57BD98; --pine-ink: #06120D; --pine-soft: #183029; --sky: #6FA8D8; --down: #EF7C74;
  --amber: #E2A64C; --track: #29322F; --veil: rgba(12, 16, 15, 0.84); --shadow: none;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.35 var(--text); -webkit-font-smoothing: antialiased;
  touch-action: manipulation; overscroll-behavior-y: none;
  -webkit-text-size-adjust: 100%;
}
body.noscroll { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
a { color: var(--pine); text-decoration: none; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- layout ---------- */
#screen { padding: calc(var(--safe-t) + 12px) 16px calc(96px + var(--safe-b)); max-width: 560px; margin: 0 auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 32px; margin-bottom: 2px; }
.status { font-size: 13px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; padding: 6px 0; }
.status .dot { width: 6px; height: 6px; border-radius: 3px; background: var(--pine); }
.status.busy .dot { animation: pulse 1s ease-in-out infinite; }
.status.off .dot { background: var(--amber); }
@keyframes pulse { 50% { opacity: .25; } }
.iconbtn { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; color: var(--ink-2); }
.iconbtn:active { background: var(--surface-2); }
h1.title { font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; margin: 2px 0 18px; }

.section { margin-top: 28px; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 8px; }
.section-h h2 { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
.section-h .aside { font-size: 15px; color: var(--ink-2); }
.section-h button.aside { color: var(--pine); }
.foot { font-size: 13px; color: var(--ink-3); padding: 8px 4px 0; line-height: 1.4; }

.group { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 52px; position: relative; width: 100%; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 0.5px solid var(--line); }
button.row:active, .row.tap:active { background: var(--surface-2); }
.row .main { flex: 1; min-width: 0; }
.row .lbl { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 8px; }
.row .sub .acct { color: var(--ink-3); }
.row .sub.wrap { white-space: normal; display: block; line-height: 1.35; }
.row .val { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 16px; text-align: right; white-space: nowrap; }
.row .val small { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; font-family: var(--text); }
.row .val small.pos { color: var(--pine); }
.row .val small.neg { color: var(--down); }
.row .chev { color: var(--ink-3); flex: none; }
.pos { color: var(--pine); }
.neg { color: var(--down); }
.muted { color: var(--ink-2); }
.row .tapmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; margin: -12px 0; padding: 12px 0; }
.row .tapmain:active { opacity: .6; }
.pill { flex: none; font-size: 13px; font-weight: 500; padding: 6px 11px; border-radius: 14px; background: var(--surface-2); color: var(--ink-2); }
.pill:active { opacity: .6; }
.tag { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }

/* ---------- hero ---------- */
.hero { padding: 6px 4px 0; }
.hero .label { font-size: 15px; color: var(--ink-2); }
.hero .big { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 46px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.05; margin: 4px 0 6px; }
.hero .delta { font-size: 15px; font-family: var(--num); }
.herobtn { display: block; width: 100%; text-align: left; }
.herobtn:active { opacity: .7; }

/* ---------- bars ---------- */
.meter { height: 6px; border-radius: 3px; background: var(--track); position: relative; margin-top: 8px; overflow: visible; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--pine); }
.meter i.warn { background: var(--amber); }
.meter i.over { background: var(--down); }
.meter b { position: absolute; top: -3px; width: 2px; height: 12px; margin-left: -1px; background: var(--ink-3); border-radius: 1px; }
.budget { padding: 12px 16px; position: relative; }
.budget + .budget::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 0.5px solid var(--line); }
.budget .top { display: flex; justify-content: space-between; gap: 12px; font-size: 16px; }
.budget .top .num { font-size: 15px; color: var(--ink-2); }
.budget .bottom { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); margin-top: 6px; }

.cols { display: flex; align-items: flex-end; gap: 4px; height: 132px; padding: 18px 12px 0; position: relative; }
.cols .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.cols .col i { display: block; width: 100%; max-width: 22px; border-radius: 4px 4px 0 0; background: var(--track); min-height: 2px; }
.cols .col.on i { background: var(--pine); }
.cols .col.future i { background: transparent; border: 1px dashed var(--track); border-bottom: 0; }
.cols .col .tip { position: absolute; bottom: calc(100% + 2px); font-size: 12px; font-family: var(--num); color: var(--ink); white-space: nowrap; font-weight: 600; }
.cols .avg { position: absolute; left: 12px; right: 12px; border-top: 1.5px dashed var(--ink-3); opacity: .7; pointer-events: none; }
.collabels { display: flex; gap: 4px; padding: 6px 12px 12px; font-size: 11px; color: var(--ink-3); }
.collabels span { flex: 1; text-align: center; }
.collabels span.on { color: var(--ink); font-weight: 600; }
.chartnote { display: flex; gap: 14px; padding: 0 16px 12px; font-size: 12px; color: var(--ink-2); }
.chartnote .key { display: inline-flex; align-items: center; gap: 6px; }
.chartnote .key i { width: 14px; border-top: 1.5px dashed var(--ink-3); }

.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 4px 16px 0; }
.split i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 16px 14px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.legend b { color: var(--ink); font-weight: 600; font-family: var(--num); }

.line { position: relative; height: 150px; margin: 44px 18px 0; }
.line svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.line .pt { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 11px; display: grid; place-items: center; }
.line .pt::after { content: ""; width: 8px; height: 8px; border-radius: 4px; background: var(--pine); box-shadow: 0 0 0 2px var(--surface); }
.line .pt.live::after { background: var(--surface); border: 2px solid var(--pine); width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; }
.line .bubble { position: absolute; transform: translate(-50%, -100%); margin-top: -14px; background: var(--ink); color: var(--bg); font-size: 12px; padding: 5px 8px; border-radius: 8px; white-space: nowrap; font-family: var(--num); pointer-events: none; }
.line .bubble span { opacity: .7; font-family: var(--text); }
.lineaxis { display: flex; justify-content: space-between; padding: 8px 16px 12px; font-size: 11px; color: var(--ink-3); }

/* ---------- controls ---------- */
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 2px; margin-bottom: 14px; }
.seg button { flex: 1; padding: 7px 0; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 10px; padding: 0 10px; height: 38px; color: var(--ink-3); }
.search input { flex: 1; border: 0; background: none; outline: none; font-size: 16px; color: var(--ink); min-width: 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 2px; margin: 0 -16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 13px; border-radius: 17px; background: var(--surface); box-shadow: var(--shadow); font-size: 14px; color: var(--ink); border: 1px solid var(--line); white-space: nowrap; }
.chip.on { background: var(--pine); color: var(--pine-ink); border-color: var(--pine); }
.chip.x::after { content: " \00d7"; }
.monthnav { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 14px; padding: 4px; box-shadow: var(--shadow); }
.monthnav .m { font-size: 17px; font-weight: 600; }
.monthnav button { width: 44px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--pine); }
.monthnav button:disabled { color: var(--ink-3); opacity: .4; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px; border-radius: 14px; background: var(--pine); color: var(--pine-ink); font-size: 17px; font-weight: 600; }
.btn.ghost { background: var(--surface); color: var(--pine); box-shadow: var(--shadow); }
.btn.danger { background: var(--surface); color: var(--down); box-shadow: var(--shadow); }
.btn:disabled { opacity: .5; }
.more { display: block; width: 100%; padding: 14px; text-align: center; color: var(--pine); font-size: 15px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); font-size: 15px; }
.daterow { font-size: 13px; color: var(--ink-2); padding: 18px 4px 6px; font-weight: 500; }
.daterow:first-child { padding-top: 6px; }

/* ---------- tab bar ---------- */
#tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: space-around; align-items: flex-start;
  padding: 6px 4px calc(var(--safe-b) + 4px);
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--line);
}
#tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 500; color: var(--ink-3); padding: 4px 0; max-width: 90px; }
#tabbar button.on { color: var(--pine); }
#tabbar .add { flex: none; width: 52px; height: 40px; border-radius: 20px; background: var(--pine); color: var(--pine-ink); display: grid; place-items: center; margin: 2px 6px 0; }
#tabbar .add:active { transform: scale(.96); }

/* ---------- pushed pages + sheets ---------- */
.page, .sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.page { animation: pagein .28s cubic-bezier(.2,.8,.2,1); }
@keyframes pagein { from { transform: translateX(30%); opacity: 0; } }
.page .inner, .sheet .inner { padding: calc(var(--safe-t) + 8px) 16px calc(40px + var(--safe-b)); max-width: 560px; margin: 0 auto; }
.navbar { display: flex; align-items: center; justify-content: space-between; height: 44px; margin: 0 -8px; position: sticky; top: 0; z-index: 2; }
.navbar button { color: var(--pine); font-size: 17px; padding: 8px; display: inline-flex; align-items: center; gap: 2px; }
.navbar button.strong { font-weight: 600; }
.navbar button:disabled { color: var(--ink-3); }
.navbar .t { font-weight: 600; font-size: 17px; }
.sheet { z-index: 40; animation: sheetin .32s cubic-bezier(.2,.8,.2,1); }
@keyframes sheetin { from { transform: translateY(40%); opacity: 0; } }
.page .navbar, .sheet .navbar { background: var(--bg); margin: 0 -16px; padding: 0 8px; }

.amount { display: flex; align-items: center; justify-content: center; gap: 2px; padding: 18px 0 8px; }
.amount span { font-family: var(--num); font-size: 40px; color: var(--ink-3); font-weight: 500; }
.amount input { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 48px; font-weight: 600; border: 0; background: none; outline: none; min-width: 1.4ch; max-width: 80%; text-align: left; padding: 0; letter-spacing: -0.02em; }
.amount input::placeholder { color: var(--ink-3); opacity: .5; }
.field { display: block; background: var(--surface); border-radius: 14px; padding: 10px 16px; box-shadow: var(--shadow); margin-top: 10px; }
.field label, .flabel { display: block; font-size: 13px; color: var(--ink-2); }
.flabel { padding: 18px 4px 8px; }
.field input { width: 100%; border: 0; background: none; outline: none; font-size: 17px; padding: 4px 0 2px; min-height: 30px; }
.wrapchips { display: flex; flex-wrap: wrap; gap: 8px; }
.wrapchips .chip { padding: 8px 12px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border-radius: 14px; padding: 12px 16px; margin-top: 10px; box-shadow: var(--shadow); width: 100%; text-align: left; }
.switch .k { width: 51px; height: 31px; border-radius: 16px; background: var(--track); position: relative; flex: none; transition: background .2s; }
.switch .k::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
.switch.on .k { background: var(--pine); }
.switch.on .k::after { transform: translateX(20px); }
.switch small { display: block; color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.err { color: var(--down); font-size: 14px; padding: 10px 4px 0; }

#toast { position: fixed; left: 50%; bottom: calc(92px + var(--safe-b)); transform: translate(-50%, 20px); opacity: 0; z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 15px; transition: all .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#ptr { position: fixed; top: calc(var(--safe-t) + 6px); left: 50%; transform: translateX(-50%); z-index: 25; font-size: 13px; color: var(--ink-2); background: var(--surface); padding: 6px 12px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.08); opacity: 0; transition: opacity .15s; pointer-events: none; }
#ptr.show { opacity: 1; }

#lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; }
#lock.show { display: flex; }
#lock .mark { width: 72px; height: 72px; border-radius: 18px; background: var(--pine); display: grid; place-items: center; }
#lock p { margin: 0; color: var(--ink-2); }
#lock .btn { max-width: 280px; }
body.veil #screen, body.veil .page, body.veil .sheet { filter: blur(18px); }

.setup { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: calc(var(--safe-t) + 24px) 20px calc(var(--safe-b) + 24px); max-width: 480px; margin: 0 auto; }
.setup h1 { font-size: 30px; margin: 18px 0 8px; letter-spacing: -0.02em; }
.setup p { color: var(--ink-2); margin: 0 0 18px; line-height: 1.45; }
.setup textarea { width: 100%; min-height: 96px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 12px; font-size: 16px; resize: vertical; margin-bottom: 12px; }
.setup ol { color: var(--ink-2); padding-left: 20px; line-height: 1.5; margin: 0 0 18px; }
.banner { background: var(--pine-soft); border-radius: 14px; padding: 12px 14px; font-size: 15px; display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; }
.banner .x { margin-left: auto; color: var(--ink-2); padding: 0 4px; }
.alert { background: var(--surface); border-radius: 14px; padding: 12px 16px; margin-top: 12px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); width: 100%; text-align: left; font-size: 15px; }
.alert .ic { width: 22px; height: 22px; border-radius: 11px; background: var(--amber); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
</style>
</head>
<body>
<main id="screen"></main>
<nav id="tabbar" hidden></nav>
<div id="pages"></div>
<div id="sheets"></div>
<div id="ptr">Release to refresh</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="lock" aria-hidden="true">
  <div class="mark"><svg width="40" height="40" viewBox="0 0 40 40" fill="none"><path d="M6 24h28" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".55"/><path d="M6 24h11" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><circle cx="17" cy="24" r="5" fill="#fff"/><circle cx="33" cy="24" r="3.5" stroke="#fff" stroke-width="2.5"/></svg></div>
  <p>Moneys is locked</p>
  <button class="btn" data-act="unlock">Unlock with Face ID</button>
</div>

<script>
'use strict';
/* ================= storage + pairing ================= */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('moneys.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('moneys.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('moneys.' + k); } catch (e) {} }
};
const STANDALONE = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

function decodePair(text) {
  if (!text) return null;
  let s = String(text).trim();
  const i = s.indexOf('pair=');
  if (i >= 0) s = s.slice(i + 5);
  s = s.replace(/[^A-Za-z0-9_\-+/=]/g, '');
  try {
    const b = s.replace(/-/g, '+').replace(/_/g, '/');
    const obj = JSON.parse(atob(b + '==='.slice((b.length + 3) % 4)));
    if (obj && /^https:\/\/script\.google(usercontent)?\.com\//.test(obj.u) && obj.k) return { u: obj.u, k: obj.k, code: s };
  } catch (e) {}
  return null;
}
(function readHash() {
  const p = decodePair(location.hash);
  if (p) { LS.set('pair', p); LS.set('justPaired', !STANDALONE); }
})();

/* ================= formatting ================= */
const F0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const F2 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const MINUS = '−';
const money = (n, cents) => (n < -0.004 ? MINUS : '') + (cents ? F2 : F0).format(Math.abs(n || 0));
const money2 = (n) => money(n, true);

const num = (v) => { if (typeof v === 'number') return v; if (v == null) return 0; const s = String(v).replace(/[$,%\s−]/g, (c) => (c === '−' ? '-' : '')); if (s === '' || s === '-') return 0; const n = parseFloat(s); return isNaN(n) ? 0 : n; };

  const m = new Map();

    if (!row) return;

      const v = row[c];
      if (typeof v !== 'string' || !v || m.has(v)) continue;
      for (let k = c + 1; k < row.length; k++) { if (row[k] != null && row[k] !== '') { m.set(v, row[k]); break; } }

function parse(raw) {
  const D = labelMap(raw.dashboard);
  const set = raw.settings || [];
  const SM = labelMap(set);
  const g = (k) => num(D.get(k));

  // categories (Settings A:D)
  const categories = [];
  const ch = findCell(set, 'Category', 0);
  if (ch) for (let r = ch[0] + 1; r < set.length; r++) {
    const row = set[r] || [];
    if (row[0] && row[1]) categories.push({ name: String(row[0]), group: String(row[1]), side: row[2] === 'Yes', hint: row[3] || '' });
  }
  // accounts (Settings F:I)
  const accounts = [];
  const ah = findCell(set, 'Account', 5);
  if (ah) for (let r = ah[0] + 1; r < set.length; r++) {
    const row = set[r] || []; const name = row[5];
    if (!name || /^total/i.test(name)) break;
    accounts.push({ name: String(name), where: row[6] || '', type: row[7] || '', balance: num(row[8]) });
  }
  // budgets
  const budgets = [];
  const bh = findCell(set, 'MONTHLY BUDGETS');
  if (bh) for (let r = bh[0] + 2; r < set.length; r++) {
    const row = set[r] || []; const name = row[bh[1]]; const lim = row[bh[1] + 1];
    if (!name) break;
    if (typeof lim === 'number' && lim > 0) budgets.push({ cat: String(name), limit: lim });
  }
  let limit401 = 0;
  for (const [k, v] of SM) if (/^401k employee limit/i.test(k)) { limit401 = num(v); break; }

  // log
  const log = (raw.log || []).map((r) => ({
    row: r[0], date: r[1] || '', what: r[2] || '', amount: num(r[3]), category: r[4] || '', account: r[5] || '', to: r[6] || '',
    refund: r[7] === 'Yes', note: r[8] || '', cat: r[9] || 'Uncategorized', group: r[10] || '', signed: num(r[11]), side: r[12] === 'Yes',
    ym: /^\d{4}-\d{2}/.test(r[1] || '') ? r[1].slice(0, 7) : ''
  }));
  log.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.row - a.row));

  // spending table
  const sp = raw.spending || [];
  const spending = { year: num(labelMap(sp).get('Year')) || new Date().getFullYear(), spend: [], income: [], named: {} };
  const sh = findCell(sp, 'Category', 0);
  if (sh) {
    let section = '';
    for (let r = sh[0] + 1; r < sp.length; r++) {
      const row = sp[r] || []; const label = row[0];
      if (!label) continue;
      if (/^(SPENDING|INCOME|WHAT YOU KEPT|WHERE IT WENT)$/.test(label)) { section = label; continue; }
      const vals = []; for (let c = 1; c <= 12; c++) vals.push(row[c] == null ? null : num(row[c]));
      const item = { name: label, vals, total: num(row[13]), avg: num(row[14]) };
      spending.named[label] = item;
      if (section === 'SPENDING' && !/^total/i.test(label)) spending.spend.push(item);
      if (section === 'INCOME' && !/^(total|401k)/i.test(label)) spending.income.push(item);
    }
  }

  // investments
  const inv = raw.investments || [];
  const holdings = [];
  const ih = findCell(inv, 'Ticker');
  if (ih) for (let r = ih[0] + 1; r < inv.length; r++) {
    const row = inv[r] || [];
    if (!row[0]) break;
    const opt = (v) => (typeof v === 'number' ? v : null);
    holdings.push({ row: r + 1, account: row[0], name: row[1] || '', ticker: row[2] || '', shares: num(row[3]), price: num(row[6] != null ? row[6] : row[4]), value: num(row[7]), role: row[8] || '', pct: num(row[9]),
      dayPct: opt(row[10]), dayAmt: opt(row[11]), ytd: opt(row[12]) });

  const kh = findCell(kk, 'VALUE USED IN NET WORTH');
  if (kh) {
    const row = kk[kh[0] + 1] || []; const c = kh[1];
    Object.assign(k401, { value: num(row[c]), you: num(row[c + 1]), match: num(row[c + 2]), pctLimit: num(row[c + 3]), note: typeof row[c + 4] === 'string' ? row[c + 4] : '' });

    const row = kk[r] || [];

    let label = String(row[0]);

    limit401, categories, accounts, budgets, log, spending, holdings, k401, history, live, paychecks, payAfter: raw.payAfter || '',

/* ================= API ================= */
async function api(action, extra) {
  const p = LS.get('pair', null);
  if (!p) { const e = new Error('Not paired'); e.code = 'auth'; throw e; }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    const res = await fetch(p.u, { method: 'POST', body: JSON.stringify(Object.assign({ key: p.k, action }, extra || {})), redirect: 'follow', signal: ctrl.signal });
    const j = await res.json();
    if (!j.ok) { const e = new Error(j.error || 'Request failed'); e.code = j.code; throw e; }
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('The sheet took too long to answer. Try again.');
    if (e instanceof TypeError) { const er = new Error('Could not reach your sheet. Check your connection.'); er.code = 'net'; throw er; }
    throw e;
  } finally { clearTimeout(timer); }
}
function ingest(raw, when) {
  S.model = parse(raw);
  S.updatedAt = when || Date.now();
  S.offline = false; S.error = '';
  if (!when) LS.set('cache', { at: S.updatedAt, raw });
  render();
  if (!when) checkPushQuietly();
}
async function refresh(manual) {
  if (S.loading || !LS.get('pair', null)) return;
  S.loading = true; paintStatus();
  try {
    const j = await api('data');
    ingest(j.data);
    if (manual) toast('Up to date');
  } catch (e) {
    S.offline = e.code === 'net';
    S.error = e.message;
    if (e.code === 'auth') { S.model = null; LS.del('cache'); render(); }
    if (manual || !S.model) toast(e.message);
  } finally { S.loading = false; paintStatus(); }
}

function txDisplay(t, acct) {
  const g = t.group, s = t.signed;
  if (acct) {
    let v = t.account === acct ? s : Math.abs(s);
    if (t.account !== acct && t.to === acct && t.refund) v = -Math.abs(s);
    return { txt: signed(v, true), cls: v > 0 ? 'pos' : '' };
  }
  if (g === 'Income') return { txt: signed(s, true), cls: s > 0 ? 'pos' : '' };
  if (g === 'Spending') return s <= 0 ? { txt: money2(-s), cls: '' } : { txt: '+' + money2(s), cls: 'pos', tag: 'Refund' };
  if (g === 'Transfer' || g === 'Investment') return { txt: money2(t.amount), cls: 'muted' };
  if (g === 'Reimbursable') return { txt: (s > 0 ? '+' : '') + money2(Math.abs(s)), cls: 'muted', tag: s > 0 ? 'Paid back' : '' };
  return { txt: signed(s, true), cls: 'muted' };
}
function txRow(t, acct) {

  return '<button class="row" data-act="edit" data-row="' + t.row + '"><div class="main"><div class="lbl">' + esc(t.what) + '</div><div class="sub">' + sub +

}
function txList(list, acct, limit) {
  if (!list.length) return '<div class="group"><div class="empty">No transactions here yet.</div></div>';
  let html = '', day = null, open = false;
  list.slice(0, limit || list.length).forEach((t) => {
    if (t.date !== day) {
      if (open) html += '</div>';
      day = t.date; html += '<div class="daterow">' + esc(dayLabel(t.date)) + '</div><div class="group">'; open = true;

function spentIn(cat, ym) {

function budgetHTML(b, ym) {

  const paceFrac = isNow ? now.getDate() / dim : 1;
  const shown = Math.max(0, used);
  const frac = shown / b.limit;
  const cls = used > b.limit ? 'over' : used > b.limit * paceFrac + 0.5 ? 'warn' : '';
  const left = b.limit - shown;
  const right = left >= 0 ? money(left) + ' left' : money(-left) + ' over';
  const paceTxt = used < -0.5 ? 'Paybacks ahead by ' + money(-used) : !isNow ? 'Final' : cls === 'warn' ? 'Ahead of pace' : cls === 'over' ? 'Over budget' : 'On pace';
  return '<button class="budget" style="display:block;width:100%;text-align:left" data-act="drill" data-cat="' + esc(b.cat) + '" data-ym="' + ym + '">' +
    '<div class="top"><span>' + esc(b.cat) + '</span><span class="num">' + money(shown) + ' of ' + money(b.limit) + '</span></div>' +
    '<div class="meter" role="img" aria-label="' + esc(b.cat) + ' ' + money(used) + ' of ' + money(b.limit) + '"><i class="' + cls + '" style="width:' + Math.min(100, frac * 100).toFixed(1) + '%"></i>' +
    (isNow ? '<b style="left:' + (paceFrac * 100).toFixed(1) + '%"></b>' : '') + '</div>' +
    '<div class="bottom"><span>' + paceTxt + '</span><span class="' + (left < 0 ? 'neg' : '') + '">' + right + '</span></div></button>';
}
function colsChart(id, values, labels, opts) {
  opts = opts || {};
  const max = Math.max(1, ...values.filter((v) => v != null).map((v) => Math.max(0, v)), opts.avg || 0);
  const sel = opts.selected != null ? opts.selected : S.chartSel[id];
  let html = '<div class="cols" role="img" aria-label="' + esc(opts.label || '') + '">';
  if (opts.avg) html += '<div class="avg" style="bottom:' + (opts.avg / max * 114).toFixed(1) + 'px"></div>';
  values.forEach((v, i) => {
    const future = v == null;
    const h = future ? 30 : Math.max(0, v) / max * 114;
    const on = i === sel;
    html += '<button class="col' + (on ? ' on' : '') + (future ? ' future' : '') + '" data-act="' + (opts.act || 'colsel') + '" data-chart="' + id + '" data-i="' + i + '" aria-label="' + esc(labels[i]) + ' ' + (future ? 'no data' : money(v)) + '">' +
      (on && !future ? '<span class="tip">' + compact(v) + '</span>' : '') + '<i style="height:' + h.toFixed(1) + 'px"></i></button>';
  });
  html += '</div><div class="collabels">' + labels.map((l, i) => '<span class="' + (i === sel ? 'on' : '') + '">' + esc(l) + '</span>').join('') + '</div>';
  if (opts.avg) html += '<div class="chartnote"><span class="key"><i></i>Average month ' + money(opts.avg) + '</span></div>';
  return html;
}

function txPanelHTML() {

  }
  const list = filteredLog();
  if (A.cat || A.q || A.account) {
    const tot = list.reduce((s, t) => s + (A.account ? txSign(t, A.account) : t.signed), 0);
    h += '<div class="foot" style="padding-top:12px">' + list.length + ' transaction' + (list.length === 1 ? '' : 's') + ', net ' + signed(tot, true) + '</div>';
  }

  return h;

function txSign(t, acct) { if (t.account === acct) return t.signed; if (t.to === acct) return t.refund ? -Math.abs(t.signed) : Math.abs(t.signed); return 0; }
function filteredLog() {
  const A = S.act; const q = A.q.trim().toLowerCase();
  return S.model.log.filter((t) => {
    if (A.account && t.account !== A.account && t.to !== A.account) return false;
    if (A.cat && t.cat !== A.cat) return false;
    if (A.ym && t.ym !== A.ym) return false;
    if (A.since && t.date < A.since) return false;
    if (q) {
      const hay = (t.what + ' ' + t.note + ' ' + t.cat + ' ' + t.account + ' ' + t.to + ' ' + t.amount.toFixed(2)).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function lineChart(pts) {
  if (pts.length < 2) return '<div class="empty">The trend fills in as monthly snapshots save.</div>';
  const vals = pts.map((p) => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const padv = Math.max((hi - lo) * 0.15, hi * 0.02, 1); lo -= padv; hi += padv;
  const t0 = parseISO(pts[0].date).getTime(), t1 = parseISO(pts[pts.length - 1].date).getTime();
  const span = Math.max(1, t1 - t0);
  const X = (p) => (parseISO(p.date).getTime() - t0) / span * 100;
  const Y = (v) => 100 - (v - lo) / (hi - lo) * 100;
  const path = pts.map((p, i) => (i ? 'L' : 'M') + X(p).toFixed(2) + ' ' + Y(p.v).toFixed(2)).join(' ');
  const area = path + ' L100 100 L0 100 Z';
  const sel = S.chartSel.nw != null ? S.chartSel.nw : pts.length - 1;
  let h = '<div class="line" role="img" aria-label="Net worth trend from ' + money(pts[0].v) + ' to ' + money(pts[pts.length - 1].v) + '"><svg viewBox="0 0 100 100" preserveAspectRatio="none">' +
    '<path d="' + area + '" fill="var(--pine)" opacity=".08"/><path d="' + path + '" fill="none" stroke="var(--pine)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>';
  pts.forEach((p, i) => { h += '<button class="pt' + (p.live ? ' live' : '') + '" style="left:' + X(p) + '%;top:' + Y(p.v) + '%" data-act="pt" data-i="' + i + '" aria-label="' + esc(shortDate(p.date)) + ' ' + money(p.v) + '"></button>'; });
  const s = pts[sel];
  const bx = Math.min(85, Math.max(15, X(s)));
  h += '<div class="bubble" style="left:' + bx + '%;top:' + Y(s.v) + '%">' + money(s.v) + ' <span>' + (s.live ? 'now' : esc(shortDate(s.date))) + '</span></div></div>';
  h += '<div class="lineaxis"><span>' + esc(shortDate(pts[0].date)) + '</span><span>Today</span></div>';
  return h;
}

/* ================= render ================= */
function setupHTML() {
  const pair = LS.get('pair', null);
  const err = S.error && pair ? '<p class="err" style="padding:0 0 14px">' + esc(S.error) + '</p>' : '';
  return '<div class="setup"><div style="width:64px;height:64px;border-radius:16px;background:var(--pine);display:grid;place-items:center">' + document.querySelector('#lock .mark').innerHTML + '</div>' +
    '<h1>Connect Moneys</h1><p>Open the pairing link from your Apps Script log on this phone, or paste it here.</p>' + err +
    '<textarea id="paircode" placeholder="Paste the pairing link" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>' +
    '<button class="btn" data-act="pair">Connect</button></div>';
}
function render() {
  const screen = document.getElementById('screen');
  const tabbar = document.getElementById('tabbar');
  if (!LS.get('pair', null) || (!S.model && S.error && /paired/i.test(S.error))) {
    screen.innerHTML = setupHTML(); tabbar.hidden = true; return;
  }
  if (!S.model) {
    screen.innerHTML = '<div class="setup" style="text-align:center;align-items:center"><p>' + (S.error ? esc(S.error) : 'Pulling your sheet') + '</p>' + (S.error ? '<button class="btn" style="max-width:220px" data-act="refresh">Try again</button>' : '') + '</div>';
    tabbar.hidden = true; return;
  }
  const a = document.activeElement;
  if (a && a.id === 'q' && S.tab === 'spending') { S.renderQueued = true; paintList(); return; }
  tabbar.hidden = false;
  tabbar.innerHTML =
    tabBtn('home', 'Home', I.home) + tabBtn('accounts', 'Accounts', I.wallet) +
    '<button class="add" data-act="add" aria-label="New entry">' + I.plus + '</button>' +
    tabBtn('spending', 'Spending', I.bars) + tabBtn('investing', 'Investing', I.trend);
  screen.innerHTML = screenHTML();
  renderPages();
}
function screenHTML() {
  return S.tab === 'accounts' ? accountsHTML() : S.tab === 'spending' ? spendingHTML() : S.tab === 'investing' ? investingHTML() : homeHTML();
}
function paintList() {
  // refresh just the list under the search box without stealing focus
  const screen = document.getElementById('screen');
  const tmp = document.createElement('div'); tmp.innerHTML = screenHTML();
  const keepTop = [...screen.children].findIndex((el) => el.classList && el.classList.contains('search'));
  if (keepTop < 0) return;
  while (screen.children.length > keepTop + 1) screen.removeChild(screen.lastChild);
  const kids = [...tmp.children]; const idx = kids.findIndex((el) => el.classList && el.classList.contains('search'));
  kids.slice(idx + 1).forEach((el) => screen.appendChild(el));
}
const tabBtn = (id, label, icon) => '<button class="' + (S.tab === id ? 'on' : '') + '" data-act="tab" data-tab="' + id + '"' + (S.tab === id ? ' aria-current="page"' : '') + '>' + icon + '<span>' + label + '</span></button>';
function renderPages() {
  const root = document.getElementById('pages');
  if (!S.pages.length) { root.innerHTML = ''; return; }
  const top = S.pages[S.pages.length - 1];
  const old = root.querySelector('.page');
  const keep = old && old.dataset.p === top ? old.scrollTop : 0;
  const body = top === 'networth' ? networthHTML() : top === 'paycheck' ? paycheckHTML() : top === 'connections' ? connectionsHTML() : top === 'inbox' ? inboxHTML() :
    top === 'notify' ? notifyHTML() : top === 'widget' ? widgetHTML() : top.startsWith('acct:') ? accountPageHTML(top.slice(5)) : '';
  root.innerHTML = '<div class="page" data-p="' + esc(top) + '"><div class="inner">' + body + '</div></div>';
  if (keep) { const p = root.querySelector('.page'); p.style.animation = 'none'; p.scrollTop = keep; }
}
function pushPage(p) { S.pages.push(p); document.body.classList.add('noscroll'); renderPages(); }
function go(tab) { S.tab = tab; LS.set('tab', tab); S.pages = []; window.scrollTo(0, 0); render(); }

let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }

/* ================= events ================= */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case 'tab':
      if (d.mode) { S.spendMode = d.mode; LS.set('spendMode', d.mode); }
      go(d.tab); break;
    case 'refresh': refresh(true); break;
    case 'settings': S.sheet = { kind: 'settings' }; showSheet(); break;
    case 'networth': pushPage('networth'); break;
    case 'paycheck': {
      const pays = S.model.paychecks.filter((p) => p.gross > 0);
      S.payIdx = d.date ? Math.max(0, pays.findIndex((p) => p.date === d.date)) : null;
      pushPage('paycheck'); break;
    }
    case 'paypick': S.payIdx = +d.i; renderPages(); document.querySelector('.page').scrollTop = 0; break;
    case 'acctpage': S.pageLimit = 100; pushPage('acct:' + d.acct); break;
    case 'morepage': S.pageLimit += 150; renderPages(); break;
    case 'spendmode': S.spendMode = d.mode; LS.set('spendMode', d.mode); window.scrollTo(0, 0); render(); break;
    case 'paystubs':
      toast('Checking your email');
      api('paystubs').then((j) => { ingest(j.data); const r = j.result || {}; toast(r.added ? r.added + ' new pay stub' + (r.added === 1 ? '' : 's') : 'No new pay stubs'); }).catch((e) => toast(e.message));
      break;
    case 'back': S.pages.pop(); if (!S.pages.length) document.body.classList.remove('noscroll'); renderPages(); break;
    case 'add': openAdd(); break;
    case 'edit': openEdit(+d.row); break;
    case 'close': closeSheet(); break;
    case 'acct': S.act.account = d.acct || null; S.act.limit = 80; render(); break;
    case 'drill':
      S.act = { mode: 'list', account: null, q: '', cat: d.cat || null, ym: d.ym || null, since: d.since || null, limit: 200 };
      S.spendMode = 'tx'; LS.set('spendMode', 'tx');
      go('spending'); break;
    case 'clearf': S.act[d.f] = null; render(); break;
    case 'more': S.act.limit += 150; render(); break;
    case 'month': {
      const [y, m] = S.spendYM.split('-').map(Number); const nm = m + Number(d.d);
      S.spendYM = y + '-' + pad(nm); render(); break;
    }
    case 'pickmonth': S.spendYM = S.model.spending.year + '-' + pad(+d.i + 1); render(); break;
    case 'colsel': S.chartSel[d.chart] = S.chartSel[d.chart] === +d.i ? null : +d.i; render(); break;
    case 'pt': S.chartSel.nw = +d.i; renderPages(); break;
    case 'dismissBanner': LS.set('justPaired', false); render(); break;
    case 'ttype': {
      const s = S.sheet; if (s.type === d.type) break;
      s.type = d.type; s.preset = null;
      if (!TYPE_GROUPS[s.type].includes(groupOf(s.cat))) s.cat = '';
      if (s.type !== 'move') s.to = '';
      showSheet(); break;
    }
    case 'preset': applyPreset(d.id); showSheet(); break;
    case 'pick': {
      const s = S.sheet; s[d.f] = d.v; s.touched[d.f] = 1;
      if (d.f === 'account' && s.to === d.v) s.to = '';
      showSheet(); break;
    }
    case 'refund': S.sheet.refund = !S.sheet.refund; showSheet(); break;
    case 'save': saveTx(); break;
    case 'del': deleteTx(); break;
    case 'snapshot':
      S.sheet = { kind: 'confirm', title: 'Save snapshot', body: 'Adds today\'s net worth of ' + money(S.model.netWorth) + ' to your Net Worth History tab.', yes: 'Save snapshot', busyLabel: 'Saving', action: 'snapshot' };
      showSheet(); break;
    case 'confirmYes': {
      const s = S.sheet; s.busy = true; showSheet();
      api(s.action).then((j) => { closeSheet(); ingest(j.data); toast('Snapshot saved'); }).catch((e) => { s.busy = false; showSheet(); toast(e.message); });
      break;
    }
    case 'toggleLock':
      if (LS.get('lockId', null)) { LS.del('lockId'); toast('Face ID is off'); showSheet(); } else enableLock();
      break;
    case 'unpair':
      if (!S.sheet.confirmUnpair) { S.sheet.confirmUnpair = true; showSheet(); break; }
      ['pair', 'cache', 'lockId', 'justPaired'].forEach(LS.del); savePairForSW(); S.model = null; closeSheet(); render(); break;
    case 'unlock': unlock(); break;
    case 'connections': S.sheet = null; showSheet(); S.confirmRemove = null; pushPage('connections'); break;
    case 'inbox': pushPage('inbox'); break;
    case 'feedadd': { const f = S.model.feed.find((x) => x.id === d.id); if (f) openFromFeed(f); break; }
    case 'feedfix': {
      const c = missingFromLog().changed.find((x) => x.f.id === d.id); if (!c) break;
      openEdit(c.t.row);
      if (S.sheet) { S.sheet.amount = Math.abs(c.f.amount).toFixed(2); S.sheet.note = S.sheet.note || 'Amount from bank'; S.sheet.focus = 'amount'; showSheet(); }
      break;
    }
    case 'feedignore': ignoreFeed(d.id); break;
    case 'notifypage': S.sheet = null; showSheet(); pushPage('notify'); loadPushState().then(renderPages); break;
    case 'pushon': {
      if (!pushSupported() || (S.push && S.push.busy)) break;
      S.push = S.push || { supported: true }; S.push.busy = true; renderPages();
      // iPhone only shows the Allow prompt if this is asked right inside the tap
      Notification.requestPermission().then((perm) => {
        if (perm !== 'granted') throw new Error(perm === 'denied' ? 'Blocked. Turn on Moneys in iPhone Settings, Notifications.' : 'Tap Allow to turn them on.');
        return subscribePush();
      }).then(() => { LS.del('pushOff'); toast('Notifications are on'); })
        .catch((e) => toast(/Unknown action/.test(e.message) ? 'Your script is an old version. Deploy a New version, then try again.' : e.message))
        .finally(() => { S.push.busy = false; loadPushState().then(renderPages); });
      break;
    }
    case 'pushoff': {
      const ep = S.push && S.push.endpoint;
      swReg().then((reg) => reg.pushManager.getSubscription()).then((sub) => sub && sub.unsubscribe())
        .then(() => (ep ? api('pushUnsubscribe', { endpoint: ep }) : null))
        .then((j) => { if (j && j.push) S.model.push = j.push; LS.set('pushOff', true); toast('Notifications are off'); })
        .catch((e) => toast(e.message)).finally(() => loadPushState().then(renderPages));
      break;
    }
    case 'widgetpage': S.sheet = null; showSheet(); S.widgetFallback = ''; loadWidgetSrc().catch(() => {}); pushPage('widget'); break;
    case 'testnotify':
      toast('Sending');
      api('testNotify').then((j) => {
        const r = j.result;
        if (!r) toast('Your script is an old version. Deploy a New version, then try again.');
        else toast(r.sent ? 'Sent. It should pop up in a few seconds.' : (r.body || 'Could not send'));
      }).catch((e) => toast(/Unknown action/.test(e.message) ? 'Your script is an old version. Deploy a New version, then try again.' : e.message));
      break;
    case 'copywidget': {
      const src = widgetSource();
      const fail = () => loadWidgetSrc().then(() => { S.widgetFallback = widgetSource(); renderPages(); toast('Copy it from the box below'); }).catch((e) => toast(e.message));
      if (!src) { fail(); break; }
      copyText(src).then(() => toast('Copied. Now paste it in Scriptable.')).catch(fail);
      break;
    }
    case 'plaidconnect': plaidConnect(d.kind, d.item); break;
    case 'plaidsync':
      toast('Syncing');
      api('plaidSync').then((r) => { ingest(r.data); toast(syncMsg(r.result)); }).catch((e) => toast(e.message));
      break;
    case 'plaidpick': S.sheet = { kind: 'plaidpick', id: d.id, busy: false }; showSheet(); break;
    case 'plaidset': {
      const s = S.sheet; if (s.busy) break; s.busy = true; s.pending = d.target || ''; s.err = ''; showSheet();
      api('plaidMap', { accountId: s.id, target: d.target || '' })
        .then((r) => { closeSheet(); ingest(r.data); toast(d.target ? 'Now checking ' + d.target : 'Not used'); })
        .catch((e) => { s.busy = false; s.pending = null; s.err = e.message; showSheet(); });
      break;
    }
    case 'plaidapply': {
      toast('Copying into your sheet');
      api('plaidApply', { accountId: d.id }).then((r) => { ingest(r.data); toast('Updated ' + ((r.result && r.result.applied) || []).join(', ')); }).catch((e) => toast(e.message));
      break;
    }
    case 'fixdiff': {
      const r = holdingDiffs(d.acct); const df = r && r.diffs.find((x) => x.ticker === d.ticker); if (!df) break;
      if (df.row) {
        const x = S.model.holdings.find((y) => y.row === df.row);
        S.sheet = { kind: 'holding', h: x, mode: 'set', val: String(df.ticker === 'CASH' ? df.real.toFixed(2) : fmtSh(df.real)), err: '', busy: false, focus: 'h-amt' };
      } else {
        S.sheet = { kind: 'newholding', account: d.acct, ticker: df.ticker, name: '', shares: String(df.ticker === 'CASH' ? df.real.toFixed(2) : fmtSh(df.real)), role: 'Satellite', err: '', busy: false };
      }
      showSheet(); break;
    }
    case 'plaidremove':
      if (S.confirmRemove !== d.item) { S.confirmRemove = d.item; renderPages(); break; }
      S.confirmRemove = null;
      api('plaidRemove', { itemId: d.item }).then((r) => { ingest(r.data); toast('Disconnected'); }).catch((e) => toast(e.message));
      break;
    case 'holding': {
      const x = S.model.holdings.find((y) => y.row === +d.row); if (!x) break;
      S.sheet = { kind: 'holding', h: x, mode: x.ticker === 'CASH' ? 'add' : 'set', val: '', err: '', busy: false, focus: 'h-amt' };
      showSheet(); break;
    }
    case 'hmode': S.sheet.mode = d.mode; S.sheet.val = ''; S.sheet.focus = 'h-amt'; showSheet(); break;
    case 'saveholding': {
      const s = S.sheet; const x = s.h; const v = parseFloat(s.val);
      if (isNaN(v)) break;
      const next = Math.round((s.mode === 'add' ? x.shares + v : v) * 1e6) / 1e6;
      s.busy = true; s.err = ''; showSheet();
      api('holding', { row: x.row, match: { account: x.account, ticker: x.ticker, shares: x.shares }, shares: next })
        .then((j) => { closeSheet(); ingest(j.data); toast('Investments updated'); })
        .catch((e) => { s.busy = false; s.err = e.message; showSheet(); });
      break;
    }
    case 'addholding': S.sheet = { kind: 'newholding', account: d.acct, ticker: '', name: '', shares: '', role: 'Satellite', err: '', busy: false }; showSheet(); break;
    case 'nhcash': S.sheet.ticker = 'CASH'; S.sheet.focus = 'h-shares'; showSheet(); break;
    case 'nhstock': if (S.sheet.ticker.toUpperCase() === 'CASH') S.sheet.ticker = ''; S.sheet.focus = 'h-ticker'; showSheet(); break;
    case 'nhrole': S.sheet.role = d.v; showSheet(); break;
    case 'savenew': {
      const s = S.sheet; s.busy = true; s.err = ''; showSheet();
      api('addHolding', { holding: { account: s.account, ticker: s.ticker.trim().toUpperCase(), name: s.name, shares: parseFloat(s.shares), role: s.role } })
        .then((j) => { closeSheet(); ingest(j.data); toast('Added to Investments'); })
        .catch((e) => { s.busy = false; s.err = e.message; showSheet(); });
      break;
    }
    case 'pair': {
      const p = decodePair(document.getElementById('paircode').value);
      if (!p) { toast('That link does not look right. Copy the whole line from the log.'); break; }
      LS.set('pair', p); savePairForSW(); S.error = ''; render(); refresh(); break;
    }
  }
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'q') { S.act.q = t.value; S.act.limit = 80; paintList(); return; }
  const s = S.sheet; if (!s) return;
  if (s.kind === 'holding' && t.id === 'h-amt') {
    s.val = t.value.replace(/[^0-9.\-]/g, ''); if (s.val !== t.value) t.value = s.val; t.style.width = amtWidth(s.val);
    const v = parseFloat(s.val); const x = s.h;
    const next = s.mode === 'add' ? x.shares + (isNaN(v) ? 0 : v) : (isNaN(v) ? x.shares : v);
    const pv = document.getElementById('h-preview'); if (pv) pv.textContent = money2(next * x.price);
    const sb = document.getElementById('h-sub'); if (sb) sb.textContent = (Math.round(next * 1e6) / 1e6) + ' shares';
    const ok = !isNaN(v) && next >= 0 && Math.abs(next - x.shares) > 1e-9;
    document.querySelectorAll('[data-act="saveholding"]').forEach((b) => { b.disabled = !ok; });
    return;
  }
  if (s.kind === 'newholding') {
    if (t.id === 'h-ticker') s.ticker = t.value; if (t.id === 'h-name') s.name = t.value;
    if (t.id === 'h-shares') { s.shares = t.value.replace(/[^0-9.]/g, ''); if (s.shares !== t.value) t.value = s.shares; }
    const ok = /^[A-Za-z0-9.:\-]{1,12}$/.test(s.ticker.trim()) && parseFloat(s.shares) > 0;
    document.querySelectorAll('[data-act="savenew"]').forEach((b) => { b.disabled = !ok; });
    return;
  }
  if (s.kind !== 'tx') return;
  if (t.id === 'f-amount') { s.amount = t.value.replace(/[^0-9.\-]/g, ''); if (s.amount !== t.value) t.value = s.amount; t.style.width = amtWidth(s.amount); syncSave(); }
  if (t.id === 'f-what') {
    s.what = t.value;
    const hit = S.model.log.find((x) => x.what.toLowerCase() === t.value.trim().toLowerCase());
    if (hit && !s.preset) {
      let changed = false;
      if (!s.touched.cat && hit.category && TYPE_GROUPS[s.type].includes(groupOf(hit.category))) { s.cat = hit.category; changed = true; }
      if (!s.touched.account && hit.account) { s.account = hit.account; changed = true; }
      if (changed) { showSheet(); return; }
    }
    syncSave();
  }
  if (t.id === 'f-note') s.note = t.value;
  if (t.id === 'f-date') { s.date = t.value; }
});
document.addEventListener('change', (ev) => { if (ev.target.id === 'f-date' && S.sheet) { S.sheet.date = ev.target.value || todayISO(); showSheet(); } });
document.addEventListener('focusout', (ev) => { if (ev.target.id === 'q' && S.renderQueued) { S.renderQueued = false; setTimeout(render, 0); } });
function syncSave() {
  const s = S.sheet;
  const ok = !s.busy && parseFloat(s.amount) && s.what.trim() && s.cat && s.account && (s.type !== 'move' || groupOf(s.cat) !== 'Transfer' || s.to);
  document.querySelectorAll('[data-act="save"]').forEach((b) => { b.disabled = !ok; });
}

// pull to refresh
const ptr = { y: null, d: 0 };
window.addEventListener('touchstart', (e) => { ptr.y = (window.scrollY <= 0 && !S.sheet && !S.pages.length && S.model) ? e.touches[0].clientY : null; ptr.d = 0; }, { passive: true });
window.addEventListener('touchmove', (e) => {
  if (ptr.y == null) return; ptr.d = e.touches[0].clientY - ptr.y;
  const el = document.getElementById('ptr'); el.textContent = ptr.d > 70 ? 'Release to refresh' : 'Pull to refresh'; el.classList.toggle('show', ptr.d > 24);
}, { passive: true });
window.addEventListener('touchend', () => { if (ptr.y != null && ptr.d > 70) refresh(true); ptr.y = null; document.getElementById('ptr').classList.remove('show'); });

// live updates: on open, on return, every minute while visible
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); if (LS.get('lockId', null)) document.body.classList.add('veil'); return; }
  if (S.locked) { /* still locked, wait for Face ID */ }
  else if (LS.get('lockId', null) && Date.now() - hiddenAt > 5 * 60 * 1000) lockShow();
  else document.body.classList.remove('veil');
  refresh();
});
setInterval(() => { if (!document.hidden) refresh(); }, 60000);
setInterval(paintStatus, 20000);

/* ================= boot ================= */
(function boot() {
  const cache = LS.get('cache', null);
  if (cache && cache.raw && LS.get('pair', null)) { try { ingest(cache.raw, cache.at); } catch (e) { LS.del('cache'); } }
  render();
  if (LS.get('lockId', null)) { lockShow(); unlock(); }
  refresh();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  savePairForSW();
  if (pushSupported()) loadPushState().catch(() => {});
})();
</script>
</body>
